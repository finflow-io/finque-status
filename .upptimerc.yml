# Upptime configuration for status.finque.de
# Every public domain and every public API endpoint of finque has a monitor
# here (see CLAUDE.md in finflow-io/finque). Docs: https://upptime.js.org/docs/configuration

owner: finflow-io
repo: finque-status

sites:
  # Not live until the production launch; enable it together with app.finque.de.
  # - name: App
  #   url: https://app.finque.de
  - name: Entwicklung
    url: https://dev.finque.de
  - name: API-Dokumentation
    url: https://developers.finque.de
  - name: API
    # Health endpoint of the api Edge Function (finque-dev). Switches to
    # https://api.finque.de/functions/v1/api/health with the production launch.
    url: https://tugraidqyulnrqbimxje.supabase.co/functions/v1/api/health

# Outages open an issue assigned here; GitHub notifies by email.
assignees:
  - christian-finflow

status-website:
  cname: status.finque.de
  logoUrl: https://raw.githubusercontent.com/finflow-io/finque-status/master/assets/finque-icon.svg
  favicon: https://raw.githubusercontent.com/finflow-io/finque-status/master/assets/favicon.svg
  name: finque Status
  introTitle: "**finque Status**"
  introMessage: Hier siehst du, ob die Dienste von finque erreichbar sind. Störungen und geplante Wartungen veröffentlichen wir an dieser Stelle.
  navbar:
    - title: Status
      href: /
    - title: API-Dokumentation
      href: https://developers.finque.de

